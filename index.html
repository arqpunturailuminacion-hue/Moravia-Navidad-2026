>Suciedad / mantenimiento</option><option value="otro">Otro</option></select><textarea id="txt" maxlength="1000" placeholder="¿Qué sucede?"></textarea><input id="pic" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"><button class="btn warn" onclick="sendReport()">Enviar reporte</button> <button class="btn gray" onclick="rdlg.close()">Cancelar</button></dialog><script>const SUPABASE_URL='https://zcvcrvmuamvtenrsfbwg.supabase.co',SUPABASE_KEY='sb_publishable_xlQe2itrWW_YxOLwW_aYYA_pMpG7FnJ';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{

});function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function emojiFor(n){n=(n||'').toLowerCase();if(n.includes('estrella'))return '⭐';if(n.includes('selfie')||n.includes('marco'))return '📸';if(n.includes('túnel')||n.includes('tunel'))return '✨';if(n.includes('pend'))return '🏳️';if(n.includes('cascada'))return '💡';if(n.includes('árbol')||n.includes('arbol'))return '🌲';return '🎄'}function markerIcon(x,p=0){let inside=x.foto_url?`<img src="${esc(x.foto_url)}">`:`<span>${emojiFor(x.nombre)}</span>`;return L.divIcon({className:'',html:`<div class="map-marker ${p?'admin-alert':''}">${inside}${p?`<span class="badge">${p}</span>`:''}</div>`,iconSize:[52,52],iconAnchor:[26,26]})}const map=L.map('map',{maxZoom:21,minZoom:16}).setView([9.96178,-84.04918],19);const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:19,maxZoom:21,attribution:'Imagery © Esri'}).addTo(map);const streets=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:19,maxZoom:21,attribution:'Tiles © Esri'});L.control.layers({'🛰️ Satélite':sat,'🗺️ Calles':streets},null,{position:'topright',collapsed:true}).addTo(map);let layer=L.layerGroup().addTo(map);
let items=[],sel=null,rateN=0;async function loadConfig(){let {data,error}=await sb.from('configuracion_sitio').select('*').eq('id',1).maybeSingle();if(error){console.warn('Configuración:',error);return}if(!data)return;siteTitle.textContent=data.titulo||'Moravia · Decoraciones 2026';siteSubtitle.textContent=data.subtitulo||'';siteHeader.style.background=data.color_encabezado||'#32174D';if(data.logo_url){siteLogo.src=data.logo_url;siteLogo.style.height=(data.logo_tamano||100)+'px';siteLogo.style.display='block';logoFallback.style.display='none'}else{siteLogo.style.display='none';logoFallback.style.display='block'}}async function load(){await loadConfig();status.textContent='Cargando elementos…';let {data,error}=await sb.from('elementos').select('*').eq('activo',true).order('codigo');if(error)return fail(error);items=data||[];layer.clearLayers();items.forEach(x=>L.marker([x.latitud,x.longitud],{icon:markerIcon(x)}).addTo(layer).bindTooltip(x.nombre).on('click',()=>openItem(x.id)));if(items.length)map.fitBounds(L.latLngBounds(items.map(x=>[x.latitud,x.longitud])).pad(.08),{maxZoom:19});status.textContent=`☁️ ${items.length} elementos disponibles`;setTimeout(()=>map.invalidateSize(),200)}function fail(e){console.error(e);status.className='status error';status.textContent='Error de conexión: '+(e.message||e)}async function openItem(id){sel=id;rateN=0;let x=items.find(v=>v.id===id);body.innerHTML='<p>Cargando ficha…</p>';dlg.showModal();let [rv,cm]=await Promise.all([sb.from('valoraciones').select('estrellas').eq('elemento_id',id),sb.from('comentarios').select('comentario,creado_en').eq('elemento_id',id).eq('aprobado',true).order('creado_en',{ascending:false}).limit(5)]);let vals=rv.data||[],avg=vals.length?(vals.reduce((a,v)=>a+v.estrellas,0)/vals.length).toFixed(1):'—',comments=cm.data||[];body.innerHTML=(x.foto_url?`<img class="photo" src="${esc(x.foto_url)}">`:'')+`<h2>${esc(x.nombre)}</h2><p>${esc(x.descripcion||'Descripción pendiente.')}</p><p>⭐ ${avg} (${vals.length} valoraciones)</p><div class="stars">${[1,2,3,4,5].map(n=>`<span onclick="setRate(${n})">☆</span>`).join('')}</div><textarea id="com" maxlength="500" placeholder="Comentario opcional"></textarea><button class="btn" onclick="saveRate()">Enviar valoración</button> <button class="btn warn" onclick="dlg.close();rdlg.showModal()">⚠ Reportar problema</button><h3>Comentarios</h3>${comments.map(c=>`<p>💬 ${esc(c.comentario)}</p>`).join('')||'<p class="muted">Sin comentarios aprobados aún.</p>'}`}function setRate(n){rateN=n;document.querySelectorAll('.stars span').forEach((s,i)=>s.textContent=i<n?'★':'☆')}async function saveRate(){
let c=document.getElementById('com').value.trim();
if(!rateN&&!c)return alert('Elegí estrellas o escribí un comentario.');
if(rateN){
  let {error}=await sb.from('valoraciones').insert({elemento_id:sel,estrellas:rateN});
  if(error)return alert('No se pudo guardar la valoración: '+error.message);
}
if(c){
  let {error}=await sb.from('comentarios').insert({elemento_id:sel,comentario:c,aprobado:false});
  if(error)return alert('La valoración se guardó, pero el comentario no: '+error.message);
}
alert(c?'¡Gracias! La valoración se guardó y el comentario quedó pendiente de aprobación.':'¡Gracias por tu valoración!');
dlg.close();
}async function sendReport(){let f=pic.files[0],path=null;if(f){if(f.size>5*1024*1024)return alert('La foto debe pesar menos de 5 MB.');let ext=(f.name.split('.').pop()||'jpg').toLowerCase(),name=crypto.randomUUID()+'.'+ext;let up=await sb.storage.from('reportes').upload(name,f,{contentType:f.type,upsert:false});if(up.error)return alert('No se pudo subir la foto: '+up.error.message);path=name}let {error}=await sb.from('reportes').insert({elemento_id:sel,tipo:typ.value,descripcion:txt.value.trim(),foto_url:path,estado:'pendiente'});if(error)return alert('No se pudo enviar el reporte: '+error.message);rdlg.close();txt.value='';pic.value='';alert('Reporte enviado. ¡Gracias por ayudarnos a cuidar el parque!')}load();</script></body></html>
